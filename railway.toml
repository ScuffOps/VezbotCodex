[build]
builder = "RAILPACK"
buildCommand = "if [ \"$RAILWAY_SERVICE_NAME\" = \"VezbotDashboard\" ]; then pnpm dashboard:build; else pnpm db:generate && pnpm build; fi"

[deploy]
preDeployCommand = [
  "pnpm db:migrate:deploy",
]
startCommand = "if [ \"$RAILWAY_SERVICE_NAME\" = \"VezbotDashboard\" ]; then pnpm dashboard:start; else pnpm start; fi"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
